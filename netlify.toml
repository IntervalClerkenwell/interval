# The site is a single index.html and a folder of photographs. There is no
# build step, and no publish directory set: Netlify serves the repository
# root as it stands. Deliberately left that way here, so this file only
# ever adds headers and cannot change how the site is deployed.

# Events get real addresses. Everything else on the site is a section of
# index.html reached by a hash, which is fine for a browser and useless
# for a preview card: an invitation is read in WhatsApp and in a mail
# client long before it is read in a browser, and neither runs the page's
# JavaScript. The edge function serves the same page with the event's own
# title and photograph already in the head.
[[edge_functions]]
  path = "/events"
  function = "event"

[[edge_functions]]
  path = "/events/*"
  function = "event"

# The Visit page gets the same treatment: real addresses with each
# section's own title and description, so somebody searching for
# galleries near Clerkenwell can actually be sent there.
[[edge_functions]]
  path = "/visit"
  function = "visit"

[[edge_functions]]
  path = "/visit/*"
  function = "visit"

# Exhibitions live in the page as sections reached by a hash, which a
# browser can show but a preview card and a search engine cannot. The
# edge function serves the same page with each show's own title,
# description and photograph in the head, the same treatment events and
# Visit already have. The old #<slug> links go on working.
[[edge_functions]]
  path = "/exhibitions/*"
  function = "exhibition"

# Photographs are written once under a name that includes the exhibition,
# and are replaced by adding a new file rather than overwriting an old one.
# Netlify's default is "max-age=0, must-revalidate", which made a returning
# visitor ask the server about all 58 of them again on every visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The page itself must never be held: an exhibition goes up by editing it,
# and a cached copy would keep showing the old show.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # base-uri is 'self', not 'none': the event/visit/exhibition edge
    # functions inject <base href="/"> so a page served from a deeper
    # path still resolves its assets from the root. 'none' would block
    # that tag and break every image on those pages. Typekit's kit CSS
    # is on use.typekit.net and @imports p.typekit.net/p.css (a
    # stylesheet), and the font files load from both hosts, so both
    # appear in style-src and font-src. Event photographs and the
    # events/RSVP API are on interval-desk.netlify.app (img-src and
    # connect-src). The Visit street plan is a self-drawn inline SVG
    # fetched from our own /assets, so no map-tile host is needed.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://use.typekit.net https://p.typekit.net; font-src https://use.typekit.net https://p.typekit.net; img-src 'self' https://interval-desk.netlify.app data:; connect-src 'self' https://interval-desk.netlify.app; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# The calendar file a guest downloads should carry the gallery's own
# domain, not the hosting company's. The events edge function passes
# paths deeper than a slug straight through, so this proxy is what
# answers. The Desk builds the file.
[[redirects]]
  from = "/events/:slug/calendar.ics"
  to = "https://interval-desk.netlify.app/api/event-ics/:slug"
  status = 200

# Icons change about never, and were being asked about on every visit.
# A week, not a year: they keep their filenames when they do change.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
